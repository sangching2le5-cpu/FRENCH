<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Nouveau Taxi ! 1 — Leçon 7–12 | Ứng dụng học tiếng Pháp A1</title>
<style>
:root{
  --bg:#eef5fc; --card:#ffffff; --pri:#4a90d9; --pri-d:#2f6fb3; --pri-l:#e4f0fb;
  --ok:#1f8a5f; --ok-l:#e4f6ee; --no:#c9453f; --no-l:#fdecea;
  --txt:#1c2b3a; --mut:#657a92; --bd:#d5e4f2; --warn:#8a6d1f; --warn-l:#fdf6e0;
  --r:14px; --sh:0 2px 10px rgba(31,80,130,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:var(--bg); color:var(--txt); line-height:1.62; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}h4{font-size:.95rem}
p{margin:0 0 .7em}
a{color:var(--pri-d)}
button{font-family:inherit;font-size:1rem;cursor:pointer}
:focus-visible{outline:3px solid #ffb020;outline-offset:2px;border-radius:6px}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
#sidebar{
  width:272px;flex:0 0 272px;background:#fff;border-right:1px solid var(--bd);
  padding:16px 12px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:60;
}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6fb1e8,#3b7cc0);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:0 0 40px}
.brand b{display:block;font-size:.95rem}
.brand small{color:var(--mut);font-size:.75rem}
.nav-sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 8px 6px;font-weight:700}
.nav-btn{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;
  padding:9px 10px;border-radius:10px;color:var(--txt);font-size:.92rem;margin-bottom:2px;
}
.nav-btn:hover{background:var(--pri-l)}
.nav-btn.active{background:var(--pri);color:#fff;font-weight:600}
.nav-btn.active .tick{color:#fff}
.nav-btn .tick{margin-left:auto;color:var(--ok);font-weight:700;font-size:.85rem}
.nav-btn .num{width:22px;text-align:center;flex:0 0 22px}
#main{flex:1;min-width:0;padding:22px 26px 80px}
.topbar{display:none;align-items:center;gap:10px;background:#fff;padding:10px 14px;
  border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40}
.topbar b{font-size:.95rem}
.hamb{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,35,60,.45);z-index:55}
.scrim.on{display:block}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;border-left:5px solid var(--pri)}
.stat .v{font-size:1.6rem;font-weight:700;color:var(--pri-d)}
.stat .l{font-size:.82rem;color:var(--mut)}
.stat .sub{font-size:.75rem;color:var(--mut)}
.muted{color:var(--mut)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--pri);color:#fff;border:0;
  border-radius:10px;padding:10px 16px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--pri-d);border:1.5px solid var(--bd)}
.btn.ghost:hover{background:var(--pri-l)}
.btn.danger{background:var(--no)}
.btn.danger:hover{background:#a83631}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}

/* ---------- badges ---------- */
.badge{display:inline-block;background:var(--pri-l);color:var(--pri-d);border-radius:999px;
  padding:2px 10px;font-size:.73rem;font-weight:600;margin:0 5px 5px 0}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.no{background:var(--no-l);color:var(--no)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.badge.plain{background:#eef2f6;color:var(--mut)}

/* ---------- tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;background:#fff;padding:6px;
  border-radius:12px;box-shadow:var(--sh)}
.tab{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--mut);font-size:.9rem}
.tab.active{background:var(--pri);color:#fff}

/* ---------- vocab ---------- */
.vocab-item{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.vocab-item.learned{border-color:#bfe6d3;background:#f6fdf9}
.vocab-top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.vocab-fr{font-weight:700;color:var(--pri-d);font-size:1.05rem}
.vocab-vi{font-weight:600}
.vocab-ex{margin-top:6px;font-size:.88rem;color:#38506a;border-left:3px solid var(--pri-l);padding-left:9px}
.vocab-ex i{color:var(--mut);font-style:normal;display:block}

/* ---------- grammar ---------- */
.rule{background:var(--pri-l);border-left:5px solid var(--pri);border-radius:10px;padding:12px 14px;
  font-weight:600;margin:10px 0;font-size:.98rem}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem;display:block;overflow-x:auto}
th,td{border:1px solid var(--bd);padding:7px 10px;text-align:left}
th{background:var(--pri-l);color:var(--pri-d)}
.warnbox{background:var(--warn-l);border-left:5px solid #e0b64a;border-radius:10px;padding:10px 13px;margin:10px 0;font-size:.9rem}
.okbox{background:var(--ok-l);border-left:5px solid #55c091;border-radius:10px;padding:10px 13px;margin:10px 0;font-size:.9rem}
.nobox{background:var(--no-l);border-left:5px solid #e08a86;border-radius:10px;padding:10px 13px;margin:10px 0;font-size:.9rem}

/* ---------- quiz ---------- */
.quiz-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px}
.qcount{font-size:.85rem;color:var(--mut);font-weight:600}
.bar{height:8px;background:#e3ecf5;border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#7fbdee,#3b7cc0);transition:width .3s}
.qtext{font-size:1.12rem;margin:6px 0 14px;font-weight:600}
.opts{display:grid;gap:9px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);
  border-radius:11px;padding:12px 14px;font-size:1rem;transition:.15s}
.opt:hover{border-color:var(--pri);background:var(--pri-l)}
.opt.selected{border-color:var(--pri);background:var(--pri-l)}
.opt.correct{border-color:var(--ok);background:var(--ok-l);font-weight:600}
.opt.wrong{border-color:var(--no);background:var(--no-l)}
.opt .mk{float:right;font-weight:700}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--bd);background:#fafcff}
.fb.good{background:var(--ok-l);border-color:#a9dfc5}
.fb.bad{background:var(--no-l);border-color:#f0bab6}
.fb h4{margin-bottom:6px}
.fb .why{margin:6px 0 0;padding-left:18px;font-size:.88rem}
.fb .why li{margin-bottom:4px}
details.acc{margin-top:10px;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:8px 12px}
details.acc summary{cursor:pointer;font-weight:600;color:var(--pri-d)}
.result{text-align:center;padding:26px}
.result .big{font-size:3rem;font-weight:800;color:var(--pri-d)}

/* ---------- activities ---------- */
.act-item{border:1px solid var(--bd);border-radius:11px;padding:11px 13px;margin-bottom:9px;background:#fff}
.act-item.ok{border-color:#a9dfc5;background:var(--ok-l)}
.act-item.no{border-color:#f0bab6;background:var(--no-l)}
input[type=text],textarea,select{font-family:inherit;font-size:1rem;padding:9px 11px;border:2px solid var(--bd);
  border-radius:9px;background:#fff;color:var(--txt);width:100%;max-width:420px}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--pri);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{background:var(--pri-l);border:1.5px solid #bcdcf7;border-radius:999px;padding:7px 13px;font-size:.92rem;color:var(--pri-d);font-weight:600}
.chip.used{opacity:.35}
.answerline{min-height:44px;border:2px dashed var(--bd);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;background:#fbfdff}

/* ---------- flashcard ---------- */
.flash{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:34px 20px;text-align:center;min-height:230px;
  display:flex;flex-direction:column;justify-content:center;cursor:pointer;border:2px solid var(--bd)}
.flash .fr{font-size:1.6rem;font-weight:700;color:var(--pri-d)}
.flash .vi{font-size:1.3rem;font-weight:700;color:var(--ok)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,35,60,.5);display:grid;place-items:center;z-index:200;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.hidden{display:none!important}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .app{flex-direction:column}
  #sidebar{position:fixed;left:0;top:0;bottom:0;height:100%;width:280px;flex:0 0 280px;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:6px 0 24px rgba(0,0,0,.16)}
  #sidebar.open{transform:none}
  .topbar{display:flex}
  #main{padding:16px 14px 90px}
  h1{font-size:1.3rem}
  .qtext{font-size:1.03rem}
  input[type=text],textarea,select{max-width:100%}
}
@media(max-width:420px){
  .btn{padding:9px 13px;font-size:.92rem}
  .card{padding:14px}
}
</style>
</head>

const GRAMMAR = [
{ id:"g-demo", lesson:7, fr:"Les adjectifs démonstratifs", vn:"Tính từ chỉ định",
  purpose:"Dùng để « chỉ » một người hoặc một vật cụ thể: cái này, cái kia, những cái này. Trong Leçon 7, bạn cần nó để nói « tôi muốn chiếc váy này », « cái quần kia quá rộng » khi mua sắm.",
  nature:"Tiếng Việt ta nói « cái váy này » — đặt « này » sau danh từ. Tiếng Pháp làm ngược lại: đặt một từ nhỏ TRƯỚC danh từ. Từ nhỏ đó phải « hợp » với danh từ về giống (đực/cái) và số (ít/nhiều). Đó là lý do có bốn dạng: ce, cet, cette, ces.",
  formula:"ce / cet / cette / ces + danh từ",
  table:{head:["Giống / Số","Dạng","Ví dụ","Nghĩa"],
    rows:[
      ["Giống đực, số ít, bắt đầu bằng phụ âm","ce","ce pantalon","cái quần này"],
      ["Giống đực, số ít, bắt đầu bằng nguyên âm hoặc h câm","cet","cet appartement","căn hộ này"],
      ["Giống cái, số ít","cette","cette robe","chiếc váy này"],
      ["Số nhiều (đực hay cái đều dùng chung)","ces","ces chaussures","đôi giày này"]
    ]},
  parts:[
    ["ce","đứng trước danh từ giống đực số ít bắt đầu bằng phụ âm: ce pull, ce sac."],
    ["cet","cũng là giống đực số ít, nhưng dùng khi từ sau bắt đầu bằng nguyên âm (a, e, i, o, u) hoặc h câm. Lý do là để dễ đọc: « ce appartement » rất khó nói, nên tiếng Pháp thêm -t → « cet appartement »."],
    ["cette","dùng cho mọi danh từ giống cái số ít: cette chemise, cette taille."],
    ["ces","dùng cho mọi danh từ số nhiều, không phân biệt giống: ces lunettes, ces baskets."]
  ],
  examples:[
    ["Je voudrais cette robe.","Tôi muốn chiếc váy này.","« robe » là danh từ giống cái số ít → cette."],
    ["Cet appartement est très lumineux.","Căn hộ này rất sáng.","« appartement » giống đực số ít, bắt đầu bằng nguyên âm a → cet."],
    ["Ces chaussures sont trop chères.","Đôi giày này quá đắt.","« chaussures » số nhiều → ces."],
    ["Ce pantalon est trop grand.","Cái quần này quá rộng.","« pantalon » giống đực số ít, bắt đầu bằng phụ âm p → ce."],
    ["Comment trouvez-vous cette chemise ?","Bạn thấy chiếc sơ mi này thế nào?","« chemise » giống cái số ít → cette."]
  ],
  uses:["Khi chỉ vào một vật trước mặt: « Ce sac est joli. »","Khi nói về thứ mình muốn mua: « Je voudrais cette taille. »","Khi hỏi ý kiến: « Comment trouves-tu cette couleur ? »"],
  exceptions:["Trước « h câm » dùng cet: cet hôtel, cet homme. Nhưng trước « h bật hơi » dùng ce: ce héros (ít gặp ở A1).","Trước danh từ số nhiều, ce/cet/cette đều biến thành ces, không phân biệt giống."],
  mistakes:["Dùng « ce » với danh từ giống cái: ✗ ce robe → ✓ cette robe.","Dùng « cette » với số nhiều: ✗ cette chaussures → ✓ ces chaussures.","Quên quy tắc nguyên âm: ✗ ce appartement → ✓ cet appartement.","Nhầm giống của danh từ: « *robe* » là giống CÁI, « *pull* » là giống ĐỰC."],
  compare:"Tiếng Việt đặt « này/kia » SAU danh từ và không đổi theo giống. Tiếng Pháp đặt TRƯỚC và phải đổi theo giống/số — đây là điểm người Việt hay quên nhất.",
  practice:"Les adjectifs démonstratifs"},

    ["Combien coûte cette robe ?","Chiếc váy này giá bao nhiêu?","« combien » + coûter để hỏi giá."],
    ["Comment trouvez-vous ce manteau ?","Bạn thấy chiếc áo khoác này thế nào?","« comment » + trouver để hỏi ý kiến."],
    ["Quels pantalons préférez-vous ?","Bạn thích những chiếc quần nào?","« pantalons » giống đực số nhiều → quels."],
    ["Où sont les cabines d'essayage ?","Phòng thử đồ ở đâu?","« où » để hỏi vị trí."]
  ],
  uses:["Hỏi giá: Combien ça coûte ?","Hỏi cỡ: Quelle taille ?","Hỏi màu: Quelle couleur ?","Hỏi ý kiến: Comment trouvez-vous… ?"],
  exceptions:["« Qu'est-ce que c'est ? » và « Qui est-ce ? » là hai câu hỏi cố định, không dùng quel.","Trong văn nói thân mật, người Pháp thường đảo: « C'est combien ? »"],
  mistakes:["Dùng « quel » với danh từ giống cái: ✗ Quel taille ? → ✓ Quelle taille ?","Quên -s ở số nhiều: ✗ Quelle chaussures ? → ✓ Quelles chaussures ?","Nhầm « comment » (như thế nào) và « combien » (bao nhiêu)."],
  compare:"Tiếng Việt hỏi « bao nhiêu », « cỡ nào » — không đổi từ hỏi. Tiếng Pháp phải đổi quel/quelle/quels/quelles theo danh từ.",
  practice:"Les mots interrogatifs"},

{ id:"g-neg", lesson:7, fr:"La négation : ne… pas", vn:"Phủ định: ne… pas",
  purpose:"Dùng để nói « không »: không thích màu này, không có cỡ của tôi, không đắt.",
  nature:"Tiếng Pháp « kẹp » động từ ở giữa hai từ nhỏ: ne + động từ + pas. Giống như hai cái kẹp bao quanh động từ.",
  formula:"Sujet + ne + verbe + pas (+ complément)",
  table:{head:["Câu khẳng định","Câu phủ định"],
    rows:[["J'aime ce manteau.","Je n'aime pas ce manteau."],["C'est cher.","Ce n'est pas cher."],["Il y a une piscine.","Il n'y a pas de piscine."]]},
  parts:[["ne (n' trước nguyên âm)","đứng ngay trước động từ."],["pas","đứng ngay sau động từ."],["verbe","nằm giữa ne và pas."]],
  examples:[
    ["Je n'aime pas cette couleur.","Tôi không thích màu này.","« aime » bắt đầu bằng nguyên âm nên ne → n'."],
    ["Ce n'est pas trop cher.","Cái này không quá đắt.","« est » bắt đầu bằng nguyên âm → n'est."],
    ["Je ne veux pas essayer ce pantalon.","Tôi không muốn thử cái quần này.","ne + veux + pas."],
    ["Il n'y a pas de cabine d'essayage ici.","Ở đây không có phòng thử đồ.","Sau phủ định, « un/une/des » thường đổi thành « de »."],
    ["Nous n'avons pas cette taille.","Chúng tôi không có cỡ này.","« avons » → n'avons."]
  ],
  uses:["Từ chối mua: « Je ne prends pas ce sac. »","Nói không thích: « Je n'aime pas le gris. »","Nói hết hàng: « Nous n'avons pas votre taille. »"],
  exceptions:["Trong văn nói, người Pháp thường bỏ « ne »: « Je sais pas. » — nhưng khi viết phải giữ đủ ne… pas.","Sau phủ định, mạo từ không xác định un/une/des → de: J'ai un sac → Je n'ai pas de sac."],
  mistakes:["Quên « ne »: ✗ Je aime pas → ✓ Je n'aime pas.","Đặt pas sai chỗ: ✗ Je ne pas aime → ✓ Je n'aime pas.","Quên rằng ne phải rút gọn trước nguyên âm: ✗ Je ne aime pas → ✓ Je n'aime pas."],
  compare:"Tiếng Việt chỉ cần thêm « không » trước hoặc sau động từ. Tiếng Pháp cần HAI từ (ne… pas) bao quanh động từ.",
  practice:"La négation"},

{ id:"g-ton", lesson:8, fr:"Les pronoms toniques", vn:"Đại từ nhấn mạnh (đại từ độc lập)",
  purpose:"Dùng khi muốn nhấn mạnh ai đó, sau giới từ (à, de, avec, chez, pour), và trong câu trả lời ngắn.",
  nature:"Ngoài moi, toi, lui… còn có je, tu, il… Hai bộ này khác nhau. « je » chỉ có thể làm chủ ngữ đứng ngay trước động từ. Còn « moi » được dùng khi đứng một mình, sau giới từ, hoặc khi muốn nhấn mạnh.",
  formula:"moi • toi • lui • elle • nous • vous • eux • elles",
  table:{head:["Người","Chủ ngữ","Đại từ nhấn mạnh","Ví dụ"],
    rows:[["ngôi 1 số ít","je","moi","C'est moi."],["ngôi 2 số ít","tu","toi","Avec toi."],["ngôi 3 số ít (đực)","il","lui","C'est lui."],
      ["ngôi 3 số ít (cái)","elle","elle","C'est elle."],["ngôi 1 số nhiều","nous","nous","Chez nous."],["ngôi 2 số nhiều","vous","vous","Pour vous."],
      ["ngôi 3 số nhiều (đực/hỗn hợp)","ils","eux","Avec eux."],["ngôi 3 số nhiều (cái)","elles","elles","Chez elles."]]},
  parts:[["moi / toi","dùng cho ngôi 1 và 2 số ít — khác hoàn toàn với je / tu."],["lui / elle","ngôi 3 số ít: lui cho nam, elle cho nữ."],["nous / vous","giống chủ ngữ, nhưng dùng sau giới từ."],["eux / elles","ngôi 3 số nhiều: eux cho nam hoặc nhóm hỗn hợp, elles cho nhóm toàn nữ."]],
  examples:[
    ["C'est moi qui ai fait ce tableau.","Chính tôi đã vẽ bức tranh này.","Sau « c'est » phải dùng đại từ nhấn mạnh: moi, không dùng je."],
    ["Elle habite chez eux.","Cô ấy sống ở nhà họ.","Sau « chez » dùng eux (nhóm nam/hỗn hợp)."],
    ["Toi et moi, nous sommes amis.","Bạn và tôi là bạn.","Sau « et », dùng toi và moi."],
    ["Je vais au cinéma avec elle.","Tôi đi xem phim với cô ấy.","Sau « avec » dùng elle."],
    ["Eux, ils habitent à Paris.","Còn họ, họ sống ở Paris.","« Eux » đặt đầu câu để nhấn mạnh."]
  ],
  uses:["Nhấn mạnh: « Moi, je préfère le bleu. »","Sau giới từ: avec lui, pour elle, chez nous.","Trả lời ngắn: « Qui veut venir ? — Moi ! »"],
  exceptions:["« nous » và « vous » có hình thức giống nhau ở cả hai bộ.","Trước động từ vẫn phải có chủ ngữ: « Moi, je travaille. » (không nói « Moi travaille » trong văn viết chuẩn)."],
  mistakes:["Dùng je sau giới từ: ✗ avec je → ✓ avec moi.","Dùng lui cho nữ: ✗ C'est lui (nói về Marie) → ✓ C'est elle.","Nhầm eux và elles khi nhóm có cả nam lẫn nữ → phải dùng eux."],
  compare:"Tiếng Việt có « tôi », « tớ », « mình » — khá linh hoạt. Tiếng Pháp tách rõ: je (chủ ngữ) và moi (mọi trường hợp khác).",
  practice:"Les pronoms toniques"},

{ id:"g-lieu", lesson:8, fr:"Les prépositions de lieu", vn:"Giới từ chỉ vị trí",
  purpose:"Dùng để mô tả đồ vật, người ở đâu: trên bàn, dưới ghế, bên trái cửa, giữa hai người.",
  nature:"Giới từ chỉ vị trí là những từ nhỏ cho biết mối quan hệ không gian giữa hai vật. Tiếng Pháp phân biệt « sur » (trên bề mặt, có tiếp xúc) và « au-dessus de » (ở phía trên, không tiếp xúc). Ở A1 chủ yếu dùng sur / sous / devant / derrière / à côté de / entre / contre.",
  formula:"[vật A] + động từ + giới từ + [vật B]",
  table:{head:["Giới từ","Nghĩa","Ví dụ"],
    rows:[["sur","trên (có tiếp xúc)","Le livre est sur la table."],["sous","dưới","Le chat est sous le lit."],
      ["devant","trước","La voiture est devant la maison."],["derrière","sau","Le jardin est derrière l'immeuble."],
      ["à côté de","bên cạnh","La poste est à côté de la banque."],["près de","gần","J'habite près de la gare."],
      ["loin de","xa","Le musée est loin d'ici."],["entre … et …","giữa … và …","Le café est entre la poste et la banque."],
      ["à gauche de","bên trái của","Le tableau est à gauche de la porte."],["à droite de","bên phải của","La photo est à droite du tableau."],
      ["en face de","đối diện","La gare est en face du musée."],["au coin de","ở góc","La banque est au coin de la rue."],
      ["au bout de","ở cuối","La cuisine est au bout du couloir."],["chez","ở nhà của (người)","Je vais chez Marie."],
      ["dans","trong","Les clés sont dans le sac."],["contre","tựa vào, sát","Le vélo est contre le mur."]]},
  parts:[["de / du / de la / des","« à côté de » + le → « à côté du » ; + les → « à côté des ». Đây là hiện tượng hòa âm (xem bài Articles contractés)."],["entre … et …","luôn đi thành cặp, phải có cả entre và et."],["chez","chỉ dùng cho NGƯỜI, không dùng cho đồ vật."]],
  examples:[
    ["Le tableau est au centre du mur.","Bức tranh ở giữa bức tường.","« au centre de + le » → « au centre du »."],
    ["La cuisine est au bout du couloir.","Nhà bếp ở cuối hành lang.","« au bout de » chỉ vị trí cuối."],
    ["Il est assis entre Paul et Marie.","Anh ấy ngồi giữa Paul và Marie.","entre + A + et + B."],
    ["Nous allons chez eux.","Chúng tôi đến nhà họ.","« chez » + đại từ nhấn mạnh."],
    ["Le sac est sous la chaise.","Cái túi ở dưới ghế.","« sous » chỉ vị trí thấp hơn."]
  ],
  uses:["Mô tả phòng, căn hộ.","Chỉ đường.","Nói ai sống ở đâu."],
  exceptions:["Trước tên thành phố dùng « à »: à Paris. Trước tên nước dùng « en / au / aux ».","« chez » không dùng cho nơi chốn vô tri: ✗ chez la banque."],
  mistakes:["Quên hòa âm: ✗ à côté de le mur → ✓ à côté du mur.","Dùng « sur » khi vật ở phía trên không tiếp xúc.","Nhầm « devant » (trước) và « avant » (trước về thời gian)."],
  compare:"Tiếng Việt nói « trên bàn », « dưới ghế » — trật tự giống tiếng Pháp. Nhưng tiếng Việt không có hiện tượng « de + le = du ».",
  practice:"Les prépositions de lieu"},

{ id:"g-ou", lesson:9, fr:"Le pronom interrogatif Où", vn:"Từ hỏi Où (ở đâu)",
  purpose:"Dùng để hỏi vị trí: phòng khách ở đâu? bưu điện ở đâu?",
  nature:"« Où » nghĩa là « ở đâu ». Nó có thể đứng đầu câu hoặc đứng cuối câu trong văn nói thân mật.",
  formula:"Où est + danh từ số ít ? • Où sont + danh từ số nhiều ? • C'est où ? • Ça se trouve où ?",
  table:{head:["Cách hỏi","Mức độ trang trọng","Ví dụ"],
    rows:[["Où est… ?","trung tính, chuẩn","Où est la cuisine ?"],["Où sont… ?","trung tính, số nhiều","Où sont les toilettes ?"],
      ["C'est où ?","thân mật, văn nói","La gare, c'est où ?"],["Ça se trouve où ?","thân mật, văn nói","Le musée, ça se trouve où ?"]]},
  parts:[["Où","từ hỏi vị trí, không đổi dạng."],["est / sont","động từ être hợp với chủ ngữ."],["se trouve","động từ « se trouver » = nằm ở, tọa lạc."]],
  examples:[
    ["Où est la salle de bains ?","Phòng tắm ở đâu?","Danh từ số ít → est."],
    ["Où sont les chambres ?","Các phòng ngủ ở đâu?","Danh từ số nhiều → sont."],
    ["L'ascenseur, c'est où ?","Thang máy ở đâu?","Cách nói thân mật trong hội thoại."],
    ["Ça se trouve où, l'office de tourisme ?","Phòng thông tin du lịch nằm ở đâu?","« ça se trouve où » rất thông dụng khi hỏi đường."],
    ["Où est-ce que tu habites ?","Bạn sống ở đâu?","Dạng đầy đủ với est-ce que."]
  ],
  uses:["Hỏi đường.","Hỏi vị trí phòng trong căn hộ.","Hỏi tầng: « Vous habitez à quel étage ? » (khác où)."],
  exceptions:["« Où » có dấu huyền (où). Nếu viết « ou » không dấu thì nghĩa là « hoặc ». Rất quan trọng!","Không dùng « où » để hỏi tầng — dùng « à quel étage »."],
  mistakes:["Viết « ou » thay vì « où »: ✗ Ou est la gare ? → ✓ Où est la gare ?","Dùng « où » với « est-ce que » sai trật tự.","Nhầm où (ở đâu) và d'où (từ đâu)."],
  compare:"Tiếng Việt « ở đâu » đặt cuối câu. Tiếng Pháp thường đặt « Où » đầu câu.",
  practice:"Le pronom interrogatif Où"},

{ id:"g-imp", lesson:10, fr:"L'impératif", vn:"Thức mệnh lệnh (câu chỉ dẫn)",
  purpose:"Dùng để ra lệnh, chỉ đường, hướng dẫn: rẽ trái, đi thẳng, bắt xe buýt số 3.",
  nature:"Thức mệnh lệnh là dạng động từ dùng khi nói với ai đó phải làm gì. Điểm đặc biệt: KHÔNG có chủ ngữ. Ta không nói « Tu tournes », mà nói « Tourne ! »",
  formula:"(tu) verbe không có -s • (nous) verbe + -ons • (vous) verbe + -ez",
  table:{head:["Người","aller","tourner","prendre","passer","traverser"],
    rows:[["tu","va","tourne","prends","passe","traverse"],["nous","allons","tournons","prenons","passons","traversons"],["vous","allez","tournez","prenez","passez","traversez"]]},
  parts:[["Dạng « tu »","lấy động từ chia với tu và BỎ -s. Ví dụ: tu tournes → tourne. Nhưng động từ « aller » có dạng đặc biệt: va."],["Dạng « nous »","giống hệt chia với nous."],["Dạng « vous »","giống hệt chia với vous. Đây là dạng lịch sự, dùng với người lạ."],["Phủ định","ne + verbe + pas: « Ne tourne pas à droite ! »"]],
  examples:[
    ["Tourne à droite !","Hãy rẽ phải!","Dạng tu của « tourner »: bỏ -s."],
    ["Va tout droit !","Hãy đi thẳng!","« aller » có dạng mệnh lệnh bất quy tắc: va."],
    ["Prends le métro ligne 3.","Hãy bắt tàu điện ngầm tuyến 3.","« prendre » với tu → prends (giữ -s)."],
    ["Traversez le pont, puis tournez à gauche.","Hãy qua cầu, rồi rẽ trái.","Dạng vous — lịch sự, dùng khi chỉ đường cho người lạ."],
    ["Ne passe pas par le boulevard.","Đừng đi qua đại lộ.","Phủ định: ne + passe + pas."]
  ],
  uses:["Chỉ đường.","Hướng dẫn làm gì đó.","Ra lệnh hoặc đề nghị: « Allons-y ! »"],
  exceptions:["« aller » (tu) → va, không phải vas.","« être » → sois / soyons / soyez. « avoir » → aie / ayons / ayez.","Trước « y » hoặc « en », dạng tu lấy lại -s vì lý do phát âm: « Vas-y ! »"],
  mistakes:["Giữ -s ở dạng tu: ✗ Tournes à droite → ✓ Tourne à droite.","Dùng chủ ngữ: ✗ Tu tourne à droite → ✓ Tourne à droite.","Nhầm « va » (mệnh lệnh) và « vas » (chỉ dùng trong vas-y)."],
  compare:"Tiếng Việt dùng « hãy » hoặc không dùng gì. Tiếng Pháp đổi dạng động từ và bỏ chủ ngữ.",
  practice:"L'impératif"},

{ id:"g-prendre", lesson:10, fr:"Le verbe prendre", vn:"Động từ prendre (lấy / bắt / đi bằng)",
  purpose:"Dùng để nói « bắt » phương tiện: prendre le bus, prendre le métro, prendre le train.",
  nature:"« prendre » là động từ bất quy tắc nhưng rất hay dùng. Nó có hai gốc: prend- (cho je, tu, il, ils) và pren- (cho nous, vous).",
  formula:"je prends • tu prends • il/elle prend • nous prenons • vous prenez • ils/elles prennent",
  table:{head:["Người","Dạng","Ví dụ"],
    rows:[["je","prends","Je prends le bus."],["tu","prends","Tu prends le métro ?"],["il / elle / on","prend","Elle prend le train."],
      ["nous","prenons","Nous prenons le taxi."],["vous","prenez","Vous prenez le TGV ?"],["ils / elles","prennent","Ils prennent le bateau."]]},
  parts:[["prend-","gốc dùng cho số ít và ngôi 3 số nhiều. Lưu ý « ils prennent » có HAI chữ n."],["pren-","gốc dùng cho nous và vous."],["-ds / -d / -t","đuôi không phát âm: prends, prend, prennent đọc giống nhau [pʁɑ̃]."]],
  examples:[
    ["Je prends le métro tous les jours.","Tôi đi tàu điện ngầm mỗi ngày.","Ngôi je → prends."],
    ["Nous prenons le bus numéro 3.","Chúng tôi bắt xe buýt số 3.","Ngôi nous → prenons (một n)."],
    ["Ils prennent le train pour Marseille.","Họ đi tàu đến Marseille.","Ngôi ils → prennent (hai n)."],
    ["Prends la première rue à droite.","Hãy rẽ phải ở con phố đầu tiên.","Dạng mệnh lệnh tu → prends."],
    ["Elle prend un taxi.","Cô ấy bắt taxi.","Ngôi il/elle → prend."]
  ],
  uses:["Nói phương tiện: prendre le bus / le métro / le train / l'avion.","Nói thời gian: « Ça prend 20 minutes. »","Mệnh lệnh chỉ đường: Prends, Prenez."],
  exceptions:["« ils prennent » viết hai n — đây là lỗi chính tả rất phổ biến.","Không nói « prendre à bus » — phải là « prendre le bus »."],
  mistakes:["✗ Nous prendons → ✓ Nous prenons.","✗ Ils prendent → ✓ Ils prennent.","Nhầm « prendre le bus » (bắt xe buýt) với « aller en bus » (đi bằng xe buýt) — cả hai đều đúng nhưng cấu trúc khác nhau."],
  compare:"Tiếng Việt nói « bắt xe buýt » và « đi bằng xe buýt » — tiếng Pháp cũng có hai cách tương ứng: prendre le bus / aller en bus.",
  practice:"Le verbe prendre"},

{ id:"g-art", lesson:10, fr:"Les articles contractés", vn:"Mạo từ rút gọn (hòa âm)",
  purpose:"Khi « à » hoặc « de » gặp « le / les », chúng bắt buộc phải « dính » lại thành một từ: au, aux, du, des.",
  nature:"Tiếng Pháp không thích hai nguyên âm gặp nhau hoặc hai từ ngắn đứng cạnh nhau. Vì vậy « à + le » luôn biến thành « au ». Đây là quy tắc BẮT BUỘC, không phải lựa chọn.",
  formula:"à + le = au • à + les = aux • de + le = du • de + les = des  ||  à + la = à la • à + l' = à l' • de + la = de la • de + l' = de l'",
  table:{head:["Kết hợp","Kết quả","Ví dụ"],
    rows:[["à + le","au","Je vais au musée."],["à + les","aux","Je parle aux enfants."],["à + la","à la","Je vais à la banque."],
      ["à + l'","à l'","Je vais à l'opéra."],["de + le","du","Je viens du marché."],["de + les","des","Je viens des Calanques."],
      ["de + la","de la","Je viens de la gare."],["de + l'","de l'","Je viens de l'aéroport."]]},
  parts:[["au / aux","hình thức rút gọn của à + le / à + les. Không bao giờ viết « à le »."],["du / des","hình thức rút gọn của de + le / de + les. Không bao giờ viết « de le »."],["à la / de la","giống cái KHÔNG rút gọn, giữ nguyên hai từ."],["à l' / de l'","trước nguyên âm hoặc h câm, le/la đều thành l'."]],
  examples:[
    ["Je vais au musée.","Tôi đi bảo tàng.","à + le musée → au musée."],
    ["Elle va à la poste.","Cô ấy đi bưu điện.","à + la poste → à la poste (không đổi)."],

    ["C'est un hôtel avec une piscine et un restaurant.","Đây là một khách sạn có bể bơi và nhà hàng.","Cấu trúc C'est un(e)… avec…."],

["L7-011",7,"Grammar Choice","Intermediate","Je ___ aime pas cette couleur.",
 ["ne","n'","pas","non"],1,

 "Tôi không thích màu này.",
 ["« ne » không thể đứng trước nguyên âm mà không rút gọn.","Đây là đáp án đúng.","« pas » phải đứng SAU động từ, không đứng trước.","« non » là trạng từ trả lời « không », không dùng trong cấu trúc phủ định."],
 "La négation","aimer","Nhớ quy tắc: ne + nguyên âm → n'."],

["L7-012",7,"Sentence Transformation","Intermediate","Chuyển sang phủ định: « J'aime ce manteau. »",
 ["Je ne aime pas ce manteau.","Je n'aime pas ce manteau.","Je aime ne pas ce manteau.","Je n'aime ce manteau pas."],1,
 "Cấu trúc phủ định là: chủ ngữ + ne + động từ + pas. Vì « aime » bắt đầu bằng nguyên âm, ne → n'. Kết quả: « Je n'aime pas ce manteau. »",
 "Tôi không thích chiếc áo khoác này.",
 ["« ne » phải rút gọn thành « n' » trước nguyên âm.","Đây là đáp án đúng.","« ne… pas » phải bao quanh động từ, không tách rời như vậy.","« pas » phải đứng ngay sau động từ « aime »."],
 "La négation","manteau","ne và pas luôn kẹp động từ ở giữa."],

["L7-015",7,"Contrastive Grammar","Intermediate","___ pantalon est trop grand pour moi.",

["L7-019",7,"Meaning and Function","Intermediate","« Comment trouvez-vous cette robe ? » dùng để làm gì?",

["L8-006",8,"Grammar Choice","Intermediate","Il est assis ___ de moi.",

 "Anh ấy ngồi cạnh tôi.",
 ["« Entre » phải đi với « et »: entre lui et moi.","Đây là đáp án đúng.","« Devant » không đi với « de moi » theo nghĩa « bên cạnh».","« Sous » nghĩa là ở dưới — không hợp nghĩa."],

   ===================================================================== */
const LS_KEY="taxi1_U2U3_progress";
const LS_VER=1;
function defaultState(){return{
  version:LS_VER, learnedVocab:{}, completedLessons:{}, grammarRead:{},
  answers:{}, mistakes:{}, lastLesson:7, lastView:"dashboard",
  testHistory:[], mode:"learn"
};}
let S=defaultState();

function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return;
    const p=JSON.parse(raw);
    if(p&&typeof p==="object"&&!Array.isArray(p)){
      const d=defaultState();
      S={...d,...p};
      S.learnedVocab=p.learnedVocab||{}; S.completedLessons=p.completedLessons||{};
      S.grammarRead=p.grammarRead||{}; S.answers=p.answers||{}; S.mistakes=p.mistakes||{};
      S.testHistory=Array.isArray(p.testHistory)?p.testHistory:[];
    }
  }catch(e){ console.warn("Dữ liệu đã lưu bị lỗi, khởi tạo lại.",e); S=defaultState(); }
}
function saveState(){
  try{ S.version=LS_VER; localStorage.setItem(LS_KEY,JSON.stringify(S)); }
  catch(e){ console.warn("Không lưu được tiến độ (localStorage đầy hoặc bị chặn).",e); }
}

/* ---- Tính tiến độ (minh bạch, hiển thị rõ cách tính) ---- */
function allVocab(){ const out=[]; Object.keys(VOCAB).forEach(k=>VOCAB[k].forEach(c=>c.items.forEach(i=>out.push(i)))); return out; }
function allGrammar(){ return GRAMMAR; }
function progress(){
  const totV=allVocab().length;
  const learned=allVocab().filter(v=>S.learnedVocab[v.id]).length;
  const lessons=[7,8,9,10,11,12];
  const doneL=lessons.filter(l=>S.completedLessons[l]).length;
  const doneG=GRAMMAR.filter(g=>S.grammarRead[g.id]).length;
  let c=0,w=0;
  Object.values(S.answers).forEach(a=>{c+=a.correct||0;w+=a.wrong||0;});
  const total=c+w;
  const acc=total?Math.round(c/total*100):0;
  const pV=totV?learned/totV:0, pL=doneL/6, pG=doneG/GRAMMAR.length, pA=acc/100;
  const pct=Math.min(100,Math.round(pV*35+pL*35+pG*20+pA*10));
  return {totV,learned,doneL,doneG,acc,c,w,total,pct,pV,pL,pG,pA};
}
function recordAnswer(q,correct){
  const a=S.answers[q.id]||{correct:0,wrong:0};
  if(correct){a.correct++;}else{a.wrong++;a.lastWrong=Date.now();}
  a.lesson=q.lesson; a.type=q.type; a.grammarPoint=q.grammarPoint; a.vocabularyPoint=q.vocabularyPoint;
  S.answers[q.id]=a;
  if(!correct){ const m=S.mistakes[q.id]||{count:0}; m.count++; m.lesson=q.lesson;
    m.category=(q.grammarPoint&&q.grammarPoint!=="Vocabulaire")?"grammar":"vocab"; m.last=Date.now(); S.mistakes[q.id]=m; }
  saveState();
}

/* ---- Tiện ích ---- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }
function norm(s){
  return String(s||"").toLowerCase().trim()
    .normalize("NFC")
    .replace(/[.,!?;:«»"'"'()\[\]{}]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function questionsByLesson(l){ return QUESTIONS.filter(q=>q.lesson===l); }
function lessonTitle(l){
  return {7:"Leçon 7 — Shopping",8:"Leçon 8 — Le coin des artistes",9:"Leçon 9 — Appartement à louer",
    10:"Leçon 10 — C'est par où ?",11:"Leçon 11 — Bon voyage !",12:"Leçon 12 — Marseille"}[l]||("Leçon "+l);
}

    </div>`;
  $("#sidebar").innerHTML=h;

    const v=b.dataset.nav; closeSidebar();

function openSidebar(){ $("#sidebar").classList.add("open"); $("#scrim").classList.add("on"); }
function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("on"); }

$("#scrim").addEventListener("click",closeSidebar);

function navigate(name,params={}){
  VIEW={name,...params};
  if(name==="lesson"){ S.lastLesson=VIEW.lesson; saveState(); }
  S.lastView=name; saveState();
  renderSidebar(); renderMain(); window.scrollTo({top:0,behavior:"instant"});
}

function weakAreas(){
  const map={};
  Object.entries(S.mistakes).forEach(([qid,info])=>{
    const q=QBY_ID[qid]; if(!q) return;
    const key=(info.category==="grammar"?q.grammarPoint:q.vocabularyPoint)||"Khác";
    if(!map[key]) map[key]={name:key,count:0,kind:info.category};
    map[key].count+=info.count;
  });
  return Object.values(map).sort((a,b)=>b.count-a.count).slice(0,6);
}

/* --- Gắn sự kiện trong tab bài học --- */
function bindLessonTab(l,tab){
  $$("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ VIEW.tab=b.dataset.tab; renderMain(); }));
  $$("[data-vocab]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.vocab; if(S.learnedVocab[id]) delete S.learnedVocab[id]; else S.learnedVocab[id]=true;
    saveState(); renderSidebar(); renderLessonTab(l,"vocab");
  }));
  const ma=$("[data-markall]");
  if(ma) ma.addEventListener("click",()=>{
    (VOCAB[l]||[]).forEach(c=>c.items.forEach(i=>S.learnedVocab[i.id]=true));
    saveState(); renderSidebar(); renderLessonTab(l,"vocab");
  });
  const fl=$("[data-flash]");
  if(fl) fl.addEventListener("click",()=>openFlashcards(VOCAB[l].flatMap(c=>c.items),l));
  $$("[data-g-read]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.gRead; if(S.grammarRead[id]) delete S.grammarRead[id]; else S.grammarRead[id]=true;
    saveState(); renderSidebar(); renderLessonTab(l,"grammar");
  }));
  $$("[data-gp-practice]").forEach(b=>b.addEventListener("click",()=>{
    const gp=b.dataset.gpPractice;
    let qs=QUESTIONS.filter(q=>q.grammarPoint===gp);
    if(qs.length<4) qs=QUESTIONS.filter(q=>q.grammarPoint===gp||q.lesson===l);
    startQuiz($("#lessonBody"), shuffle(qs).slice(0,10), "learn", "Luyện: "+gp);
  }));
  $$("[data-lq]").forEach(b=>b.addEventListener("click",()=>{
    const mode=b.dataset.lq; const host=$("#quizHost");
    const qs=questionsByLesson(l);
    if(mode==="learn") startQuiz(host,qs,"learn","Leçon "+l+" — Học");
    else if(mode==="test") startQuiz(host,shuffle(qs),"test","Leçon "+l+" — Kiểm tra",{save:true});
    else startQuiz(host,shuffle(qs).slice(0,8),"learn","Leçon "+l+" — Ôn nhanh");
  }));
  // activities
  (ACTIVITIES[l]||[]).forEach(a=>{
    const host=document.querySelector(`[data-actbody="${a.id}"]`); if(!host) return;
    renderActivity(host,a,l);
  });
}

/* =====================================================================
   PHẦN 8 — RENDER CÁC DẠNG BÀI TẬP
   ===================================================================== */
function renderActivity(host,a,l){
  if(a.type==="mcq"){
    const qs=(a.qids||[]).map(id=>QBY_ID[id]).filter(Boolean);
    host.innerHTML=`<div class="btnrow"><button class="btn sm">Làm bài (${qs.length} câu)</button></div>`;
    host.querySelector("button").addEventListener("click",()=>startQuiz(host,qs,"learn","Bài tập dạng sách — Leçon "+l));
    return;
  }
  if(a.type==="match"){
    const rights=shuffle(a.pairs.map(p=>p[1]));
    host.innerHTML=a.pairs.map((p,i)=>`<div class="act-item" data-m="${i}">
        <b>${esc(p[0])}</b>
        <div style="margin-top:6px"><select data-msel="${i}"><option value="">— chọn nghĩa —</option>${rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select></div>
        <div class="tiny fbmsg" style="margin-top:5px"></div></div>`).join("")+
      `<div class="btnrow"><button class="btn sm">Kiểm tra</button><button class="btn sm ghost">Làm lại</button></div>`;
    const btns=host.querySelectorAll("button");
    btns[0].addEventListener("click",()=>{
      let ok=0;
      a.pairs.forEach((p,i)=>{
        const sel=host.querySelector(`[data-msel="${i}"]`);
        const box=host.querySelector(`[data-m="${i}"]`);
        const msg=box.querySelector(".fbmsg");
        if(sel.value===p[1]){ ok++; box.classList.add("ok"); box.classList.remove("no"); msg.innerHTML="✓ Đúng."; }
        else { box.classList.add("no"); box.classList.remove("ok"); msg.innerHTML="✗ Đáp án đúng: <b>"+esc(p[1])+"</b>"; }
      });
      host.querySelector(".btnrow").insertAdjacentHTML("beforebegin",`<p class="small"><b>Kết quả: ${ok}/${a.pairs.length}</b></p>`);
    });
    btns[1].addEventListener("click",()=>renderActivity(host,a,l));
    return;
  }
  if(a.type==="fill"){
    host.innerHTML=a.items.map((it,i)=>`<div class="act-item" data-f="${i}">
        <b>${esc(it.s)}</b>
        <div style="margin-top:6px"><input type="text" data-fin="${i}" placeholder="Nhập câu trả lời…" autocomplete="off"></div>
        <div class="tiny muted" style="margin-top:4px">💡 Gợi ý: ${esc(it.hint||"Đọc kỹ ngữ cảnh.")}</div>
        <div class="tiny fbmsg" style="margin-top:5px"></div></div>`).join("")+
      `<div class="btnrow"><button class="btn sm">Kiểm tra</button><button class="btn sm ghost">Làm lại</button></div>`;
    const b=host.querySelectorAll("button");
    b[0].addEventListener("click",()=>{
      let ok=0;
      a.items.forEach((it,i)=>{
        const inp=host.querySelector(`[data-fin="${i}"]`);
        const box=host.querySelector(`[data-f="${i}"]`);
        const msg=box.querySelector(".fbmsg");
        const alts=String(it.a).split("|").map(x=>norm(x));
        const val=norm(inp.value);
        if(alts.includes(val)){ ok++; box.classList.add("ok"); box.classList.remove("no"); msg.innerHTML="✓ Đúng."; }
        else{ box.classList.add("no"); box.classList.remove("ok");
          msg.innerHTML="✗ Đáp án đúng: <b>"+esc(String(it.a).replace(/\|/g," / "))+"</b>"; }
      });
      host.querySelector(".btnrow").insertAdjacentHTML("beforebegin",`<p class="small"><b>Kết quả: ${ok}/${a.items.length}</b></p>`);
    });
    b[1].addEventListener("click",()=>renderActivity(host,a,l));
    return;
  }
  if(a.type==="tf"){
    host.innerHTML=a.items.map((it,i)=>`<div class="act-item" data-t="${i}">
        <b>${esc(it.s)}</b>
        <div class="btnrow"><button class="btn sm ghost" data-tf="${i}-1">Đúng</button><button class="btn sm ghost" data-tf="${i}-0">Sai</button></div>
        <div class="tiny fbmsg" style="margin-top:5px"></div></div>`).join("");
    host.querySelectorAll("[data-tf]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const [i,v]=btn.dataset.tf.split("-").map(Number);
        const it=a.items[i], box=host.querySelector(`[data-t="${i}"]`), msg=box.querySelector(".fbmsg");
        const chosen=!!v;
        if(chosen===it.a){ box.classList.add("ok"); box.classList.remove("no"); msg.innerHTML="✓ Đúng. "+esc(it.exp); }
        else{ box.classList.add("no"); box.classList.remove("ok"); msg.innerHTML="✗ Sai. Đáp án đúng: <b>"+(it.a?"Đúng":"Sai")+"</b>. "+esc(it.exp); }
      });
    });
    return;
  }
  if(a.type==="order"){
    const pool=shuffle(a.words.map((w,i)=>({w,i})));
    host.innerHTML=`<p class="small muted">Nhấn vào từng từ theo thứ tự đúng. Nhấn lại vào từ trong khung để bỏ ra.</p>
      <div class="answerline" data-line></div>
      <div class="chips" data-pool>${pool.map((p,k)=>`<button class="chip" data-w="${k}">${esc(p.w)}</button>`).join("")}</div>
      <div class="btnrow"><button class="btn sm">Kiểm tra</button><button class="btn sm ghost">Làm lại</button></div>
      <div class="fbmsg small" style="margin-top:8px"></div>`;
    const line=host.querySelector("[data-line]");
    let picked=[];
    host.querySelectorAll("[data-w]").forEach(ch=>{
      ch.addEventListener("click",()=>{
        const k=+ch.dataset.w;
        if(ch.classList.contains("used")){ ch.classList.remove("used"); picked=picked.filter(x=>x!==k); }
        else { ch.classList.add("used"); picked.push(k); }
        line.innerHTML=picked.map(k=>`<span class="chip">${esc(pool[k].w)}</span>`).join(" ");
      });
    });
    const bs=host.querySelectorAll("button.btn");
    bs[0].addEventListener("click",()=>{
      const built=picked.map(k=>pool[k].w).join(" ");
      const msg=host.querySelector(".fbmsg");
      if(norm(built)===norm(a.answer)) msg.innerHTML="<b style='color:var(--ok)'>✓ Chính xác!</b>";
      else msg.innerHTML="<b style='color:var(--no)'>✗ Chưa đúng.</b><br>Câu trả lời của bạn: "+esc(built)+"<br>Đáp án: <b>"+esc(a.answer)+"</b>";
    });
    bs[1].addEventListener("click",()=>renderActivity(host,a,l));
    return;
  }
  if(a.type==="short"){
    host.innerHTML=`<p class="small muted">Câu trả lời mở. Ứng dụng kiểm tra bằng cách so khớp từ khóa — <b>không phải phân tích ngữ nghĩa đầy đủ</b>. Hãy tự đối chiếu với bài mẫu.</p>
      <textarea rows="4" data-short placeholder="Viết câu trả lời bằng tiếng Pháp…"></textarea>
      <div class="btnrow"><button class="btn sm">Kiểm tra</button><button class="btn sm ghost" data-show>Xem bài mẫu</button></div>
      <div class="fbmsg small" style="margin-top:10px"></div>`;
    host.querySelector("button.btn").addEventListener("click",()=>{
      const v=norm(host.querySelector("[data-short]").value);
      const msg=host.querySelector(".fbmsg");
      if(!v){ msg.innerHTML="Bạn chưa nhập gì."; return; }
      const hits=(a.accept||[]).filter(k=>v.includes(norm(k)));
      msg.innerHTML=`<b>Nhận xét tự động:</b> tìm thấy ${hits.length}/${(a.accept||[]).length} từ khóa gợi ý.<br>
        <span class="tiny">Lưu ý: đây chỉ là kiểm tra từ khóa, không đánh giá ngữ pháp. Hãy tự so sánh với bài mẫu.</span><br>
        <b>Bài mẫu:</b> ${esc(a.model)}<br><span class="tiny muted">${esc(a.tips||"")}</span>`;
    });
    host.querySelector("[data-show]").addEventListener("click",()=>{
      host.querySelector(".fbmsg").innerHTML=`<b>Bài mẫu:</b> ${esc(a.model)}<br><span class="tiny muted">${esc(a.tips||"")}</span>`;
    });
    return;
  }
  host.innerHTML=`<p class="muted small">Dạng bài này chưa được hỗ trợ hiển thị.</p>`;
}

/* =====================================================================
   PHẦN 9 — QUIZ ENGINE
   ===================================================================== */
let QZ=null;

function startQuiz(host,questions,mode,title,opts={}){
  if(!host) return;
  if(!questions.length){ host.innerHTML=`<p class="muted">Không có câu hỏi.</p>`; return; }
  const qs=questions.map(q=>({...q,shuffled:shuffle(q.options.map((t,i)=>({t,i})))}));
  QZ={host,qs,mode,title,i:0,sel:new Array(qs.length).fill(null),
      done:new Array(qs.length).fill(false),opts,finished:false};
  renderQZ();
}
function renderQZ(){
  if(!QZ) return;
  if(QZ.finished){ renderQZResult(); return; }
  const {host,qs,i,mode,title}=QZ;
  const q=qs[i];
  const sel=QZ.sel[i];
  const revealed=(mode==="learn"&&QZ.done[i]);
  let h=`<div class="quiz">
    <div class="quiz-head">
      <div><span class="badge">${esc(title)}</span><span class="badge">Leçon ${q.lesson}</span>
        <span class="badge plain">${esc(q.difficulty)}</span><span class="badge plain">${esc(q.type)}</span>
        <span class="badge ${q.source===LBL_AI?"":"warn"}">${esc(q.source)}</span></div>
      <div class="qcount">Câu ${i+1} / ${qs.length}</div>
    </div>
    <div class="bar"><span style="width:${Math.round(i/qs.length*100)}%"></span></div>
    <h3 class="qtext">${esc(q.question)}</h3>
    <div class="opts">`;
  q.shuffled.forEach((o,k)=>{
    let cls="opt";
    if(revealed){
      if(o.i===q.correctAnswer) cls+=" correct";
      else if(sel===o.i) cls+=" wrong";
    } else if(sel===o.i) cls+=" selected";
    let mk="";
    if(revealed){ if(o.i===q.correctAnswer) mk="✓"; else if(sel===o.i) mk="✗"; }
    h+=`<button class="${cls}" data-opt="${o.i}" ${revealed?"disabled":""}>
      <span class="mk">${mk}</span>${esc(o.t)}</button>`;
  });
  h+=`</div>`;

  if(!revealed){
    h+=`<div class="btnrow">
      <button class="btn sm ghost" data-hint>💡 Gợi ý</button>
      ${mode==="learn"?`<button class="btn sm" data-check ${sel===null?"disabled":""}>Kiểm tra</button>`:""}
      ${mode==="test"?`<button class="btn sm" data-next>${i===qs.length-1?"Nộp bài":"Câu tiếp →"}</button>`:""}
    </div><div id="hintBox"></div>`;
  } else {
    h+=feedbackHTML(q,sel);
  }
  h+=`</div>`;
  host.innerHTML=h;

  host.querySelectorAll("[data-opt]").forEach(b=>b.addEventListener("click",()=>{
    QZ.sel[i]=+b.dataset.opt;
    if(mode==="test"){ renderQZ(); }
    else { QZ.done[i]=true; recordAnswer(q,QZ.sel[i]===q.correctAnswer); renderQZ(); }
  }));
  const hb=host.querySelector("[data-hint]");
  if(hb) hb.addEventListener("click",()=>{
    const t=TIPS[q.grammarPoint]||TIPS["Vocabulaire"];
    host.querySelector("#hintBox").innerHTML=`<div class="okbox small"><b>Gợi ý:</b> ${esc(q.hint||t.tip)}</div>`;
  });
  const cb=host.querySelector("[data-check]");
  if(cb) cb.addEventListener("click",()=>{
    if(QZ.sel[i]===null) return;
    QZ.done[i]=true; recordAnswer(q,QZ.sel[i]===q.correctAnswer); renderQZ();
  });
  const nb=host.querySelector("[data-next]");
  if(nb) nb.addEventListener("click",()=>{
    if(i<qs.length-1){ QZ.i++; renderQZ(); } else { finishQuiz(); }
  });
  const rt=host.querySelector("[data-retry]");
  if(rt) rt.addEventListener("click",()=>{ QZ.sel[i]=null; QZ.done[i]=false; renderQZ(); });
  const nx=host.querySelector("[data-continue]");
  if(nx) nx.addEventListener("click",()=>{
    if(i<qs.length-1){ QZ.i++; renderQZ(); } else { finishQuiz(); }
  });
}
function feedbackHTML(q,sel){
  const ok=(sel===q.correctAnswer);
  const tip=TIPS[q.grammarPoint]||TIPS["Vocabulaire"];
  let h=`<div class="fb ${ok?"good":"bad"}">
    <h4>${ok?"✓ Chính xác!":"✗ Chưa đúng"}</h4>
    <p class="small"><b>Đáp án đúng:</b> ${esc(q.options[q.correctAnswer])}</p>
    ${q.translationVN?`<p class="small"><b>Dịch nghĩa:</b> ${esc(q.translationVN)}</p>`:""}
    <p class="small"><b>Giải thích:</b> ${esc(q.explanationVN)}</p>`;
  if(q.grammarPoint&&q.grammarPoint!=="Vocabulaire") h+=`<p class="tiny"><span class="badge">Ngữ pháp: ${esc(q.grammarPoint)}</span>${q.vocabularyPoint?`<span class="badge plain">Từ vựng: ${esc(q.vocabularyPoint)}</span>`:""}</p>`;
  h+=`<details class="acc"><summary>Vì sao các phương án khác sai?</summary><ul class="why">`;
  q.options.forEach((o,i)=>{
    if(i===q.correctAnswer) h+=`<li><b>${esc(o)}</b> — <span style="color:var(--ok)">${esc(q.whyWrong[i]||"Đây là đáp án đúng.")}</span></li>`;
    else h+=`<li><b>${esc(o)}</b> — ${esc(q.whyWrong[i]||"Không phù hợp với ngữ cảnh/ngữ pháp của câu.")}</li>`;
  });
  h+=`</ul></details>`;
  h+=`<div class="okbox small" style="margin-top:10px"><b>💡 Mẹo ghi nhớ:</b> ${esc(tip.tip)}</div>`;
  h+=`<div class="small" style="margin-top:8px"><b>Câu ví dụ tương tự:</b> <i>${esc(tip.sim)}</i></div>`;
  h+=`<div class="btnrow"><button class="btn sm ghost" data-retry>↻ Thử lại câu này</button>
    <button class="btn sm" data-continue>Tiếp tục →</button></div></div>`;
  return h;
}
function finishQuiz(){
  QZ.finished=true;
  if(QZ.mode==="test"&&QZ.opts.save){
    let sc=0; QZ.qs.forEach((q,i)=>{ if(QZ.sel[i]===q.correctAnswer) sc++; });
    QZ.qs.forEach((q,i)=>{
      if(QZ.sel[i]!==null) recordAnswer(q,QZ.sel[i]===q.correctAnswer);
    });
    S.testHistory.push({date:Date.now(),title:QZ.title,score:sc,total:QZ.qs.length});
    saveState(); renderSidebar();
  }
  renderQZResult();
}
function renderQZResult(){
  const {host,qs,mode}=QZ;
  let correct=0,answered=0;
  qs.forEach((q,i)=>{ if(QZ.sel[i]!==null){answered++; if(QZ.sel[i]===q.correctAnswer) correct++;} });
  const pct=Math.round(correct/qs.length*100);
  let h=`<div class="card"><div class="result">
    <div class="big">${correct}/${qs.length}</div>
    <p class="muted">Tỉ lệ đúng: ${pct}% · Số câu đã trả lời: ${answered}/${qs.length}</p>
    <p class="small">${mode==="test"?"Chế độ kiểm tra: câu chưa trả lời được tính là sai và không được tính điểm.":"Chế độ học: hãy đọc lại phần giải thích bên dưới."}</p>
    <div class="btnrow" style="justify-content:center">
      <button class="btn" data-again>↻ Làm lại (đảo câu hỏi & đáp án)</button>
      <button class="btn ghost" data-review-wrong>Xem lại câu sai</button>
    </div></div>`;

  h+=`<details class="acc" open><summary>Xem chi tiết từng câu</summary>`;
  qs.forEach((q,i)=>{
    const sel=QZ.sel[i];
    const ok=sel===q.correctAnswer;
    const tip=TIPS[q.grammarPoint]||TIPS["Vocabulaire"];
    h+=`<div class="act-item ${sel===null?"":(ok?"ok":"no")}" style="margin-top:10px">
      <b>Câu ${i+1}:</b> ${esc(q.question)}
      <div class="small" style="margin-top:5px">Bạn chọn: <b>${sel===null?"(không trả lời)":esc(q.options[sel])}</b> ${sel===null?"":(ok?"✓":"✗")}</div>
      <div class="small">Đáp án đúng: <b style="color:var(--ok)">${esc(q.options[q.correctAnswer])}</b></div>
      <div class="small">${esc(q.explanationVN)}</div>
      ${q.translationVN?`<div class="small muted">Dịch: ${esc(q.translationVN)}</div>`:""}
      <div class="tiny muted">💡 ${esc(tip.tip)}</div>
    </div>`;
  });
  h+=`</details></div>`;
  host.innerHTML=h;

  const again=host.querySelector("[data-again]");
  if(again) again.addEventListener("click",()=>{
    startQuiz(host,shuffle(QZ.qs.map(q=>QBY_ID[q.id]||q)),QZ.mode,QZ.title,QZ.opts);
  });
  const rw=host.querySelector("[data-review-wrong]");
  if(rw) rw.addEventListener("click",()=>{
    const wrong=QZ.qs.filter((q,i)=>QZ.sel[i]!==q.correctAnswer).map(q=>QBY_ID[q.id]||q);
    if(!wrong.length){ host.insertAdjacentHTML("afterbegin",`<p class="small" style="color:var(--ok)"><b>Tuyệt vời — không có câu sai!</b></p>`); return; }
    startQuiz(host,wrong,"learn",QZ.title+" — Câu sai");
  });
}

/* ---------------- FLASHCARD ---------------- */
function openFlashcards(items,lesson){
  let idx=0,flipped=false;
  const host=$("#modalHost");
  function draw(){
    const it=items[idx];
    host.innerHTML=`<div class="modal"><div class="box">
      <div class="quiz-head"><b>Flashcard — Leçon ${lesson}</b><span class="qcount">${idx+1}/${items.length}</span></div>
      <div class="flash" id="flipCard">
        ${flipped?`<div class="vi">${esc(it.vi)}</div><div class="small muted" style="margin-top:8px">${esc(it.ex||"")}</div>`
                 :`<div class="fr">${esc(it.fr)}</div>${it.ipa?`<div class="small muted">${esc(it.ipa)}</div>`:""}
                  <div class="tiny muted" style="margin-top:12px">Nhấn để xem nghĩa</div>`}
      </div>
      <div class="btnrow">
        <button class="btn sm ghost" data-prev ${idx===0?"disabled":""}>← Trước</button>
        <button class="btn sm" data-flip>Lật thẻ</button>
        <button class="btn sm ghost" data-next ${idx===items.length-1?"disabled":""}>Sau →</button>
        <button class="btn sm ghost" data-learn>${S.learnedVocab[it.id]?"↺ Bỏ đánh dấu":"✓ Đã học"}</button>
      </div>
      <div class="btnrow"><button class="btn danger sm" data-close>Đóng</button></div>
    </div></div>`;
    host.querySelector("#flipCard").addEventListener("click",()=>{ flipped=!flipped; draw(); });
    host.querySelector("[data-flip]").addEventListener("click",()=>{ flipped=!flipped; draw(); });
    const pv=host.querySelector("[data-prev]"); if(pv) pv.addEventListener("click",()=>{ idx--; flipped=false; draw(); });
    const nx=host.querySelector("[data-next]"); if(nx) nx.addEventListener("click",()=>{ idx++; flipped=false; draw(); });
    host.querySelector("[data-learn]").addEventListener("click",()=>{
      if(S.learnedVocab[it.id]) delete S.learnedVocab[it.id]; else S.learnedVocab[it.id]=true;
      saveState(); renderSidebar(); draw();
    });
    host.querySelector("[data-close]").addEventListener("click",()=>{ host.innerHTML=""; });
  }
  draw();
}

function viewTest(){
  let h=`<h1>Bài kiểm tra tổng hợp</h1>
  <p class="muted small">Chế độ Kiểm tra: không hiện giải thích trong lúc làm; chỉ hiện kết quả sau khi nộp. Câu hỏi và đáp án được <b>đảo thứ tự mỗi lần làm</b>. Câu bỏ trống tính là sai.</p>
  <div class="card"><h3>Chọn bài kiểm tra</h3><div class="grid g2">
    <div class="act-item"><b>Toàn khóa (Leçon 7–12)</b><div class="tiny muted">30 câu ngẫu nhiên · ~15 phút</div>
      <div class="btnrow"><button class="btn sm" data-test="all">Bắt đầu</button></div></div>`;
  [7,8,9,10,11,12].forEach(l=>{
    h+=`<div class="act-item"><b>${esc(lessonTitle(l))}</b><div class="tiny muted">20 câu · theo bài</div>
      <div class="btnrow"><button class="btn sm ghost" data-test="${l}">Bắt đầu</button></div></div>`;
  });
  h+=`</div></div><div id="testHost"></div>`;
  setTimeout(()=>{
    $$("[data-test]").forEach(b=>b.addEventListener("click",()=>{
      const v=b.dataset.test;
      const qs=(v==="all")?shuffle(QUESTIONS).slice(0,30):shuffle(questionsByLesson(+v));
      const title=(v==="all")?"Kiểm tra tổng hợp Leçon 7–12":("Kiểm tra "+lessonTitle(+v));
      startQuiz($("#testHost"),qs,"test",title,{save:true});
    }));
  },0);
  return h;
}

function viewMistakes(){
  const ids=Object.keys(S.mistakes);
  let h=`<h1>Câu sai của tôi</h1>`;
  if(!ids.length){
    h+=`<div class="card"><p>Chưa có câu sai nào được lưu. Hãy làm bài tập ở chế độ Học hoặc Kiểm tra.</p></div>`;
    return h;
  }
  const qs=ids.map(id=>QBY_ID[id]).filter(Boolean);
  const vocab=qs.filter(q=>!q.grammarPoint||q.grammarPoint==="Vocabulaire");
  const gram=qs.filter(q=>q.grammarPoint&&q.grammarPoint!=="Vocabulaire");
  h+=`<div class="card"><p class="small">Bạn đang có <b>${qs.length}</b> câu cần ôn lại: <span class="badge">${gram.length} ngữ pháp</span><span class="badge plain">${vocab.length} từ vựng</span></p>
    <p class="tiny muted">Lưu ý: việc làm lại nhiều lần <b>không đảm bảo</b> bạn đã thành thạo. Hãy đọc kỹ phần giải thích và tự đặt câu mới.</p>
    <div class="btnrow">
      <button class="btn" data-rev="all">Luyện lại tất cả (${qs.length})</button>
      <button class="btn ghost" data-rev="gram">Chỉ ngữ pháp (${gram.length})</button>
      <button class="btn ghost" data-rev="vocab">Chỉ từ vựng (${vocab.length})</button>
      <button class="btn danger" data-clear>Xóa lịch sử câu sai</button>
    </div></div>
    <div class="card"><h3>Danh sách câu sai</h3>`;
  qs.slice(0,60).forEach(q=>{
    const m=S.mistakes[q.id];
    h+=`<div class="act-item"><span class="badge ${m.category==="grammar"?"":"plain"}">${m.category==="grammar"?"Ngữ pháp":"Từ vựng"}</span>
      <span class="badge plain">Leçon ${q.lesson}</span><span class="badge warn">Sai ${m.count} lần</span>
      <div class="small" style="margin-top:6px"><b>${esc(q.question)}</b></div>
      <div class="tiny muted">Đáp án: ${esc(q.options[q.correctAnswer])}</div>
      <details class="acc"><summary>Giải thích</summary><div class="small">${esc(q.explanationVN)}</div></details>
    </div>`;
  });
  h+=`</div><div id="revHost"></div>`;

  setTimeout(()=>{
    $$("[data-rev]").forEach(b=>b.addEventListener("click",()=>{
      const t=b.dataset.rev;
      const list=t==="gram"?gram:(t==="vocab"?vocab:qs);
      if(!list.length){ alert("Không có câu nào trong nhóm này."); return; }
      startQuiz($("#revHost"),shuffle(list),"learn","Ôn lại câu sai");
    }));
    const cl=$("[data-clear]");
    if(cl) cl.addEventListener("click",()=>{
      if(confirm("Bạn có chắc muốn xóa toàn bộ lịch sử câu sai? Hành động này không thể hoàn tác.")){
        S.mistakes={}; saveState(); renderSidebar(); renderMain();
      }
    });
  },0);
  return h;
}

/* =====================================================================
   PHẦN 11 — SỰ KIỆN CHUNG
   ===================================================================== */
function bindMain(){
  $$("[data-nav]").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.nav;
    if(v.startsWith("lesson-")) navigate("lesson",{lesson:+v.split("-")[1],tab:"vocab"});
    else navigate(v);
  }));
  $$("[data-nav2]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.nav2)));
  $$("[data-open-lesson]").forEach(b=>b.addEventListener("click",()=>navigate("lesson",{lesson:+b.dataset.openLesson,tab:"vocab"})));
  $$("[data-quick-quiz]").forEach(b=>b.addEventListener("click",()=>{
    const l=+b.dataset.quickQuiz;
    navigate("lesson",{lesson:l,tab:"quiz"});
    setTimeout(()=>{
      const host=$("#quizHost");
      if(host) startQuiz(host,shuffle(questionsByLesson(l)).slice(0,10),"learn","Leçon "+l+" — Luyện nhanh");
    },60);
  }));
  const cont=$("[data-continue]");
  if(cont) cont.addEventListener("click",()=>navigate("lesson",{lesson:S.lastLesson,tab:"vocab"}));
  const rst=$("[data-reset]");
  if(rst) rst.addEventListener("click",()=>{
    if(confirm("Bạn có chắc muốn xóa TOÀN BỘ tiến độ học tập? (từ vựng đã học, điểm, câu sai, lịch sử kiểm tra) Hành động này không thể hoàn tác.")){
      if(confirm("Xác nhận lần cuối: xóa tất cả dữ liệu?")){
        S=defaultState(); saveState(); renderSidebar(); renderMain();
      }
    }
  });
}

/* =====================================================================
   PHẦN 12 — KHỞI ĐỘNG
   ===================================================================== */
loadState();
renderSidebar();
renderMain();

/* Xuất một số hàm ra window để dễ kiểm tra khi phát triển (không bắt buộc) */
window.__taxi1={progress,QUESTIONS,GRAMMAR,VOCAB,state:()=>S};
</script>
</body>
</html>
